notes: >-
  Four client-side view controls over the board payload as it already ships: customer
  search (accent-insensitive, name + CUIT), circuit FAC/PRE, pool payment method built
  from the pool itself, and a lane sort order. Status chips and a hide-closed toggle
  were offered and declined. No RPC, field, domain or security change; filter state
  lives in the OWL component and dies with the action. Totals and counts follow the
  filter and carry the unfiltered figure beside them; the pool's assignment chip stays
  keyed on the unfiltered pool. Filters hide, they never disable a drop zone.
